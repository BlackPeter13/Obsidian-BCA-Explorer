server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Explorer API, same-origin for the page (avoids CORS entirely).
    location /api/ {
        proxy_pass http://nbxplorer-bca:24444/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Stats service (found blocks, supply, rich list), same-origin for the page.
    location /stats/ {
        proxy_pass http://bca-stats:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
